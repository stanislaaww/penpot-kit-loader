<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Kit Builder</title></head>
<body style="font:12px/1.4 sans-serif;background:#15161c;color:#f4f5f7;margin:10px">
<div id="s">Kit Builder готов. Жду данные сборки…</div>
<script>
  var s = document.getElementById('s');
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;      // только вкладка Penpot
    var d = e.data; if (!d) return;
    if (d.type === 'kit-ops') { s.textContent = 'Строю… (' + d.ops.length + ' команд)'; window.parent.postMessage(d, '*'); }
    else if (d.type === 'done') { s.textContent = 'Пакет выполнен: ок ' + d.ok + ', ошибок ' + d.bad; }
  });
</script>
</body></html>
